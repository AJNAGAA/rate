<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2b28;
    --ink-soft:#4c5a56;
    --paper:#eef0ea;
    --card:#ffffff;
    --line:#d8dcd2;
    --amber:#b8792a;
    --amber-deep:#8f5c1c;
    --teal:#2f6f62;
    --rose:#a8492e;
    --rose-bg:#f6e9e4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 42px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .slab{font-family:'Roboto Slab',serif;}

  header.top{
    background:var(--ink);
    color:#f2efe6;
    position:sticky;
    top:0;
    z-index:40;
    box-shadow:0 2px 0 var(--amber);
  }
  .top-inner{
    max-width:1200px;margin:0 auto;padding:18px 20px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border:2px solid var(--amber);border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Roboto Slab',serif;font-weight:700;color:var(--amber);font-size:15px;
    transform:rotate(-4deg);
  }
  .brand h1{font-family:'Roboto Slab',serif;font-size:19px;font-weight:700;margin:0;letter-spacing:.2px;}
  .brand span{display:block;font-size:11px;color:#b7bcb0;letter-spacing:.12em;text-transform:uppercase;}

  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;
    padding:10px 16px;border-radius:6px;border:1px solid transparent;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:transform .08s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--amber);color:#1c1206;}
  .btn-primary:hover{background:var(--amber-deep);}
  .btn-ghost{background:transparent;color:#eee9dc;border-color:#4a564f;}
  .btn-ghost:hover{background:#2a3a35;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--amber);}

  main{max-width:1200px;margin:0 auto;padding:26px 20px 60px;}

  .toolbar{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
    display:flex;gap:14px;flex-wrap:wrap;align-items:center;
    margin-bottom:22px;
  }
  .toolbar .field{flex:1 1 240px;min-width:200px;position:relative;}
  .toolbar input, .toolbar select{
    width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:6px;
    font-family:'Inter';font-size:14px;background:#fbfbf8;outline:none;
  }
  .toolbar select{padding-left:12px;}
  .toolbar input:focus, .toolbar select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(47,111,98,.12);}
  .toolbar .field svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:#94998f;}

  .summary-strip{
    display:flex;gap:0;border:1px dashed var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px;background:var(--card);
  }
  .summary-strip .cell{flex:1;padding:14px 18px;border-right:1px dashed var(--line);}
  .summary-strip .cell:last-child{border-right:none;}
  .summary-strip .label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);}
  .summary-strip .value{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:19px;margin-top:2px;}

  #itemsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    display:flex;flex-direction:column;
    position:relative;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .card:hover{box-shadow:0 6px 18px rgba(28,43,40,.1);transform:translateY(-2px);}
  .card .photo{height:150px;background:#e7e9e1;position:relative;overflow:hidden;}
  .card .photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .stamp{
    position:absolute;top:10px;right:-6px;
    background:var(--ink);color:#f2efe6;
    font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:4px 10px 4px 12px;border-radius:3px 0 0 3px;
    transform:rotate(2deg);
    box-shadow:0 2px 4px rgba(0,0,0,.25);
  }
  .thumbs{display:flex;gap:5px;padding:8px 10px;overflow-x:auto;background:#f6f5ef;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .thumbs img{width:32px;height:32px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex-shrink:0;cursor:pointer;}
  .card .body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .card h3{font-family:'Roboto Slab',serif;font-size:15.5px;margin:0;line-height:1.3;}
  .card .rate-row{display:flex;justify-content:space-between;align-items:flex-end;padding-top:9px;border-top:1px dashed var(--line);}
  .card .rate-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);}
  .card .rate-value{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;color:var(--teal);}
  .card .actions{display:flex;gap:6px;}
  .icon-btn{
    width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);
  }
  .icon-btn:hover{border-color:var(--teal);color:var(--teal);}
  .icon-btn.danger:hover{border-color:var(--rose);color:var(--rose);background:var(--rose-bg);}

  .empty, .loading{
    text-align:center;padding:60px 20px;background:var(--card);border:1px dashed var(--line);border-radius:8px;color:var(--ink-soft);
  }
  .empty svg{width:44px;height:44px;color:#c3c8ba;margin-bottom:10px;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,26,22,.55);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;
  }
  .overlay.hidden{display:none;}
  .modal{
    background:var(--card);border-radius:10px;max-width:480px;width:100%;
    max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);
    border-top:4px solid var(--amber);
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);}
  .modal-head h2{font-family:'Roboto Slab',serif;font-size:18px;margin:0;}
  .modal-close{background:none;border:none;cursor:pointer;color:#8b9089;padding:4px;}
  .modal-close:hover{color:var(--ink);}
  .modal form{padding:20px;display:flex;flex-direction:column;gap:15px;}
  .modal label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
  .modal input[type=text], .modal input[type=number], .modal select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-family:'Inter';font-size:14px;outline:none;background:#fbfbf8;
  }
  .modal input:focus, .modal select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(47,111,98,.12);}
  .row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .link-btn{background:none;border:none;color:var(--teal);font-size:12.5px;font-weight:600;cursor:pointer;}
  .link-btn:hover{text-decoration:underline;}
  input[type=file]{font-size:13px;}
  input[type=file]::file-selector-button{
    background:#eef0ea;border:1px solid var(--line);border-radius:6px;padding:7px 12px;margin-right:10px;
    font-family:'Inter';font-weight:600;font-size:12.5px;color:var(--ink);cursor:pointer;
  }
  .preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
  .preview-grid.hidden{display:none;}
  .preview-item{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#eee;}
  .preview-item img{width:100%;height:100%;object-fit:cover;}
  .preview-item button{
    position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:var(--rose);color:#fff;
    border:none;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .hint{font-size:11.5px;color:#8b9089;margin-top:6px;}

  .group-row{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13.5px;}
  .group-row + .group-row{margin-top:6px;}
  .group-empty{font-size:12.5px;color:#8b9089;text-align:center;padding:14px;}

  .toast-stack{position:fixed;bottom:18px;right:18px;z-index:70;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--ink);color:#f2efe6;padding:11px 16px;border-radius:7px;font-size:13.5px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);border-left:3px solid var(--amber);max-width:320px;
    animation:slidein .18s ease;
  }
  .toast.error{border-left-color:var(--rose);}
  @keyframes slidein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  @media (prefers-reduced-motion: reduce){
    .card, .toast{transition:none;animation:none;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="brand-mark">SR</div>
      <div>
        <h1>Stock Register</h1>
        <span>Items &amp; Purchase Rates</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button id="openGroupModalBtn" class="btn btn-ghost">Manage Groups</button>
      <button id="openModalBtn" class="btn btn-primary">+ Add Item</button>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="field" style="flex:2 1 320px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="text" id="searchInput" placeholder="Search items…" autocomplete="off" />
    </div>
    <div class="field">
      <select id="groupFilter"><option value="ALL">All party groups</option></select>
    </div>
  </div>

  <div class="summary-strip" id="summaryStrip"></div>

  <div id="loadingState" class="loading">Loading register…</div>
  <div id="itemsGrid" style="display:none;"></div>
  <div id="emptyState" class="empty" style="display:none;">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
    <p id="emptyMessage">Nothing in the register yet — add your first item.</p>
  </div>
</main>

<!-- Item modal -->
<div id="itemModal" class="overlay hidden">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Add item</h2>
      <button class="modal-close" data-close="itemModal" aria-label="Close">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="addItemForm">
      <input type="hidden" id="itemId" />
      <div>
        <label for="itemName">Item name</label>
        <input type="text" id="itemName" required placeholder="e.g. Wireless Mouse" maxlength="120" />
      </div>
      <div>
        <label for="purchaseRate">Purchase rate (₹)</label>
        <input type="number" step="0.01" min="0" id="purchaseRate" required placeholder="0.00" />
      </div>
      <div>
        <div class="row-between">
          <label style="margin:0;">Party group</label>
          <button type="button" id="quickAddGroupBtn" class="link-btn">+ New group</button>
        </div>
        <select id="partyGroup"><option value="General">General</option></select>
      </div>
      <div>
        <label for="imageInput">Photos</label>
        <input type="file" id="imageInput" multiple accept="image/*" />
        <div id="imagePreviewContainer" class="preview-grid hidden"></div>
        <p class="hint">Photos are compressed automatically to keep the record light.</p>
      </div>
      <button type="submit" id="saveBtn" class="btn btn-primary" style="justify-content:center;">Save item</button>
    </form>
  </div>
</div>

<!-- Group modal -->
<div id="groupModal" class="overlay hidden">
  <div class="modal" style="max-width:420px;">
    <div class="modal-head">
      <h2>Party groups</h2>
      <button class="modal-close" data-close="groupModal" aria-label="Close">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div style="padding:20px;">
      <form id="addGroupForm" style="display:flex;gap:8px;margin-bottom:16px;">
        <input type="text" id="newGroupName" required placeholder="New group name" maxlength="60" style="flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font-family:'Inter';font-size:13.5px;" />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <div id="groupsList" style="max-height:220px;overflow-y:auto;"></div>
    </div>
  </div>
</div>

<!-- Delete confirm -->
<div id="deleteModal" class="overlay hidden" style="z-index:60;">
  <div class="modal" style="max-width:360px;text-align:center;border-top-color:var(--rose);">
    <div style="padding:24px 22px;">
      <div style="width:44px;height:44px;border-radius:50%;background:var(--rose-bg);color:var(--rose);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      </div>
      <h3 class="slab" style="margin:0 0 6px;font-size:16.5px;">Remove this record?</h3>
      <p id="deleteModalMessage" style="font-size:13.5px;color:var(--ink-soft);margin:0 0 20px;">This cannot be undone.</p>
      <div style="display:flex;gap:10px;">
        <button id="cancelDeleteBtn" class="btn btn-outline" style="flex:1;justify-content:center;">Cancel</button>
        <button id="confirmDeleteBtn" class="btn" style="flex:1;justify-content:center;background:var(--rose);color:#fff;">Delete</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

// NOTE: this config is safe to expose client-side, but make sure your
// Firestore Security Rules actually restrict who can read/write —
// the API key alone does not protect your data.
const firebaseConfig = {
  apiKey: "AIzaSyB0ldphifJBVDNZdIXaz4QTJ98e_hSRYfg",
  authDomain: "rate-bf39a.firebaseapp.com",
  projectId: "rate-bf39a",
  storageBucket: "rate-bf39a.firebasestorage.app",
  messagingSenderId: "898189513913",
  appId: "1:898189513913:web:7b5005b37bb49d7098f768"
};

const PLACEHOLDER_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200"><rect width="100%" height="100%" fill="#e7e9e1"/><text x="50%" y="50%" font-family="sans-serif" font-size="13" fill="#9aa093" text-anchor="middle" dy=".3em">No photo</text></svg>`
);

let db, itemsCollection, groupsCollection;
try {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  itemsCollection = collection(db, "items");
  groupsCollection = collection(db, "party_groups");
} catch (err) {
  console.error("Firebase init error:", err);
  showToast("Could not connect to the database.", true);
}

let itemsData = [];
let groupsData = [];
let selectedImageFiles = [];
let deleteTarget = { id: null, type: null };
let itemsLoaded = false;

const $ = (id) => document.getElementById(id);
const itemsGrid = $("itemsGrid");
const loadingState = $("loadingState");
const emptyState = $("emptyState");
const emptyMessage = $("emptyMessage");
const searchInput = $("searchInput");
const groupFilter = $("groupFilter");
const summaryStrip = $("summaryStrip");

const itemModal = $("itemModal");
const addItemForm = $("addItemForm");
const modalTitle = $("modalTitle");
const itemIdInput = $("itemId");
const partyGroupSelect = $("partyGroup");
const imageInput = $("imageInput");
const imagePreviewContainer = $("imagePreviewContainer");

const groupModal = $("groupModal");
const addGroupForm = $("addGroupForm");
const newGroupNameInput = $("newGroupName");
const groupsList = $("groupsList");

const deleteModal = $("deleteModal");
const deleteModalMessage = $("deleteModalMessage");

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function showToast(message, isError = false) {
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = message;
  $("toastStack").appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function openOverlay(el) { el.classList.remove("hidden"); document.addEventListener("keydown", escCloser); }
function closeOverlay(el) { el.classList.add("hidden"); document.removeEventListener("keydown", escCloser); }
function escCloser(e) {
  if (e.key !== "Escape") return;
  [itemModal, groupModal, deleteModal].forEach(m => { if (!m.classList.contains("hidden")) closeOverlay(m); });
}
document.querySelectorAll(".overlay").forEach(ov => {
  ov.addEventListener("click", (e) => { if (e.target === ov) closeOverlay(ov); });
});
document.querySelectorAll("[data-close]").forEach(btn => {
  btn.addEventListener("click", () => closeOverlay($(btn.dataset.close)));
});

$("openModalBtn").addEventListener("click", () => { resetModalForm(); openOverlay(itemModal); });
$("openGroupModalBtn").addEventListener("click", () => openOverlay(groupModal));
$("quickAddGroupBtn").addEventListener("click", () => openOverlay(groupModal));
$("cancelDeleteBtn").addEventListener("click", () => {
  closeOverlay(deleteModal);
  deleteTarget = { id: null, type: null };
});

function resetModalForm() {
  addItemForm.reset();
  itemIdInput.value = "";
  selectedImageFiles = [];
  renderImagePreviews();
  modalTitle.textContent = "Add item";
  partyGroupSelect.value = "General";
}

imageInput.addEventListener("change", (e) => {
  const files = Array.from(e.target.files || []);
  if (files.length) {
    selectedImageFiles = [...selectedImageFiles, ...files];
    renderImagePreviews();
  }
  imageInput.value = "";
});

function renderImagePreviews() {
  imagePreviewContainer.innerHTML = "";
  if (!selectedImageFiles.length) {
    imagePreviewContainer.classList.add("hidden");
    return;
  }
  imagePreviewContainer.classList.remove("hidden");
  selectedImageFiles.forEach((item, index) => {
    const wrap = document.createElement("div");
    wrap.className = "preview-item";
    const img = document.createElement("img");
    img.src = typeof item === "string" ? item : URL.createObjectURL(item);
    const rm = document.createElement("button");
    rm.type = "button";
    rm.textContent = "×";
    rm.setAttribute("aria-label", "Remove photo");
    rm.onclick = () => { selectedImageFiles.splice(index, 1); renderImagePreviews(); };
    wrap.append(img, rm);
    imagePreviewContainer.appendChild(wrap);
  });
}

const compressSingleImage = (item, maxWidth, quality) => new Promise((resolve, reject) => {
  if (typeof item === "string") return resolve(item);
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    img.src = e.target.result;
  };
  reader.onerror = reject;
  reader.readAsDataURL(item);
});

async function compressImagesToFitLimit(filesList) {
  const count = filesList.length;
  let maxWidth = 800, quality = 0.7;
  if (count > 12) { maxWidth = 250; quality = 0.25; }
  else if (count > 8) { maxWidth = 350; quality = 0.35; }
  else if (count > 4) { maxWidth = 450; quality = 0.5; }
  else if (count > 2) { maxWidth = 600; quality = 0.6; }

  let results = await Promise.all(filesList.map(f => compressSingleImage(f, maxWidth, quality)));
  let totalBytes = new Blob([JSON.stringify(results)]).size;
  while (totalBytes > 850 * 1024 && maxWidth > 150) {
    maxWidth -= 50; quality = Math.max(0.05, quality - 0.05);
    results = await Promise.all(filesList.map(f => compressSingleImage(f, maxWidth, quality)));
    totalBytes = new Blob([JSON.stringify(results)]).size;
  }
  return results;
}

addItemForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!itemsCollection) return showToast("Not connected to the database.", true);

  const saveBtn = $("saveBtn");
  saveBtn.disabled = true;
  const originalLabel = saveBtn.textContent;
  saveBtn.textContent = "Saving…";

  try {
    const id = itemIdInput.value || null;
    const name = $("itemName").value.trim();
    const rate = parseFloat($("purchaseRate").value);
    const group = partyGroupSelect.value || "General";

    if (!name) throw new Error("Item name is required.");
    if (!Number.isFinite(rate) || rate < 0) throw new Error("Enter a valid purchase rate.");

    let imagesBase64 = [];
    if (selectedImageFiles.length) imagesBase64 = await compressImagesToFitLimit(selectedImageFiles);

    const payload = {
      name,
      purchaseRate: rate,
      partyGroup: group,
      images: imagesBase64.length ? imagesBase64 : []
    };

    if (id) {
      await updateDoc(doc(db, "items", id), payload);
      showToast("Item updated.");
    } else {
      payload.createdAt = new Date().toISOString();
      await addDoc(itemsCollection, payload);
      showToast("Item added.");
    }
    resetModalForm();
    closeOverlay(itemModal);
  } catch (error) {
    console.error("Save error:", error);
    showToast(error.message || "Could not save item.", true);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = originalLabel;
  }
});

addGroupForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const groupName = newGroupNameInput.value.trim();
  if (!groupName || !groupsCollection) return;
  if (groupsData.some(g => (g.name || "").toLowerCase() === groupName.toLowerCase())) {
    return showToast("That group already exists.", true);
  }
  try {
    await addDoc(groupsCollection, { name: groupName, createdAt: new Date().toISOString() });
    newGroupNameInput.value = "";
    showToast("Group added.");
  } catch (error) {
    showToast("Could not add group: " + error.message, true);
  }
});

if (groupsCollection) {
  onSnapshot(query(groupsCollection, orderBy("name", "asc")), (snapshot) => {
    groupsData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderGroupsUI();
  }, (err) => { console.error("Groups sync error:", err); showToast("Could not load groups.", true); });
}

function renderGroupsUI() {
  const currentFilter = groupFilter.value;
  const currentForm = partyGroupSelect.value;

  groupFilter.innerHTML = '<option value="ALL">All party groups</option><option value="General">General</option>';
  partyGroupSelect.innerHTML = '<option value="General">General</option>';
  groupsList.innerHTML = "";

  if (!groupsData.length) {
    groupsList.innerHTML = '<div class="group-empty">No party groups yet — items default to "General".</div>';
  }

  groupsData.forEach(group => {
    const name = group.name || "Unassigned";
    groupFilter.add(new Option(name, name));
    partyGroupSelect.add(new Option(name, name));

    const row = document.createElement("div");
    row.className = "group-row";
    const label = document.createElement("span");
    label.textContent = name;
    const btn = document.createElement("button");
    btn.className = "icon-btn danger";
    btn.style.width = "28px"; btn.style.height = "28px";
    btn.setAttribute("aria-label", `Delete group ${name}`);
    btn.innerHTML = '<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>';
    btn.addEventListener("click", () => promptDeleteGroup(group.id, name));
    row.append(label, btn);
    groupsList.appendChild(row);
  });

  if (currentFilter) groupFilter.value = currentFilter;
  if (currentForm) partyGroupSelect.value = currentForm;
}

function promptDeleteGroup(id, name) {
  const inUse = itemsData.filter(i => i.partyGroup === name).length;
  deleteTarget = { id, type: "group" };
  deleteModalMessage.textContent = inUse
    ? `${inUse} item${inUse === 1 ? "" : "s"} use "${name}". They'll move to "General" if you delete it.`
    : `Delete the party group "${name}"? This cannot be undone.`;
  openOverlay(deleteModal);
}

function promptDeleteItem(id, name) {
  deleteTarget = { id, type: "item" };
  deleteModalMessage.textContent = `Delete "${name}" from the register?`;
  openOverlay(deleteModal);
}

$("confirmDeleteBtn").addEventListener("click", async () => {
  if (!deleteTarget.id || !deleteTarget.type || !db) return;
  const { id, type } = deleteTarget;
  const btn = $("confirmDeleteBtn");
  btn.disabled = true;
  try {
    if (type === "item") {
      await deleteDoc(doc(db, "items", id));
      showToast("Item deleted.");
    } else if (type === "group") {
      const group = groupsData.find(g => g.id === id);
      const groupName = group?.name;
      const affected = itemsData.filter(i => i.partyGroup === groupName);
      await Promise.all(affected.map(i => updateDoc(doc(db, "items", i.id), { partyGroup: "General" })));
      await deleteDoc(doc(db, "party_groups", id));
      showToast("Group deleted.");
    }
  } catch (error) {
    showToast("Delete failed: " + error.message, true);
  } finally {
    btn.disabled = false;
    closeOverlay(deleteModal);
    deleteTarget = { id: null, type: null };
  }
});

if (itemsCollection) {
  onSnapshot(query(itemsCollection, orderBy("createdAt", "desc")), (snapshot) => {
    itemsData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    itemsLoaded = true;
    loadingState.style.display = "none";
    renderItems();
  }, (err) => {
    console.error("Items sync error:", err);
    loadingState.textContent = "Could not load the register.";
    showToast("Could not load items.", true);
  });
}

let searchDebounce;
searchInput.addEventListener("input", () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(renderItems, 150);
});
groupFilter.addEventListener("change", renderItems);

function renderSummary(items) {
  const total = items.length;
  const avg = total ? items.reduce((s, i) => s + (i.purchaseRate || 0), 0) / total : 0;
  const groupsUsed = new Set(items.map(i => i.partyGroup || "General")).size;
  summaryStrip.innerHTML = `
    <div class="cell"><div class="label">Items shown</div><div class="value mono">${total}</div></div>
    <div class="cell"><div class="label">Avg. purchase rate</div><div class="value mono">₹${avg.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</div></div>
    <div class="cell"><div class="label">Party groups in view</div><div class="value mono">${groupsUsed}</div></div>
  `;
}

function renderItems() {
  if (!itemsLoaded) return;
  const term = searchInput.value.trim().toLowerCase();
  const selectedGroup = groupFilter.value;

  const filtered = itemsData.filter(item => {
    const name = (item.name || "").toLowerCase();
    const group = item.partyGroup || "General";
    const matchesSearch = name.includes(term);
    const matchesGroup = selectedGroup === "ALL" || group === selectedGroup;
    return matchesSearch && matchesGroup;
  });

  renderSummary(filtered);
  itemsGrid.innerHTML = "";

  if (!filtered.length) {
    itemsGrid.style.display = "none";
    emptyState.style.display = "block";
    emptyMessage.textContent = itemsData.length
      ? "No items match your search or filter."
      : "Nothing in the register yet — add your first item.";
    return;
  }
  emptyState.style.display = "none";
  itemsGrid.style.display = "grid";

  filtered.forEach(item => {
    const images = Array.isArray(item.images) && item.images.length ? item.images : [PLACEHOLDER_IMG];
    const rate = typeof item.purchaseRate === "number" ? item.purchaseRate : 0;
    const groupName = item.partyGroup || "General";

    const card = document.createElement("div");
    card.className = "card";

    const photo = document.createElement("div");
    photo.className = "photo";
    photo.innerHTML = `<img src="${images[0]}" alt="${escapeHtml(item.name || 'Item')}" loading="lazy" />
      <span class="stamp">${escapeHtml(groupName)}</span>`;
    card.appendChild(photo);

    if (images.length > 1) {
      const thumbs = document.createElement("div");
      thumbs.className = "thumbs";
      images.forEach((src, idx) => {
        const t = document.createElement("img");
        t.src = src;
        t.alt = `Photo ${idx + 1}`;
        t.addEventListener("click", () => { photo.querySelector("img").src = src; });
        thumbs.appendChild(t);
      });
      card.appendChild(thumbs);
    }

    const body = document.createElement("div");
    body.className = "body";
    body.innerHTML = `
      <h3>${escapeHtml(item.name || "Unnamed item")}</h3>
      <div class="rate-row">
        <div>
          <div class="rate-label">Purchase rate</div>
          <div class="rate-value">₹${rate.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</div>
        </div>
        <div class="actions">
          <button class="icon-btn" aria-label="Edit item" data-edit="${item.id}">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          </button>
          <button class="icon-btn danger" aria-label="Delete item" data-delete="${item.id}">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>
    `;
    body.querySelector("[data-edit]").addEventListener("click", () => editItem(item.id));
    body.querySelector("[data-delete]").addEventListener("click", () => promptDeleteItem(item.id, item.name || "this item"));
    card.appendChild(body);

    itemsGrid.appendChild(card);
  });
}

function editItem(id) {
  const item = itemsData.find(i => i.id === id);
  if (!item) return;
  itemIdInput.value = item.id;
  $("itemName").value = item.name || "";
  $("purchaseRate").value = item.purchaseRate ?? 0;
  partyGroupSelect.value = item.partyGroup || "General";
  selectedImageFiles = Array.isArray(item.images) ? [...item.images] : [];
  renderImagePreviews();
  modalTitle.textContent = "Edit item";
  openOverlay(itemModal);
}
</script>
</body>
</html>
